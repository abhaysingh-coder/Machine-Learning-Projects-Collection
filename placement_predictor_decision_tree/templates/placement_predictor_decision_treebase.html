{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Placement Predictor Decision Tree
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'CSS/placement_predictor_decision_tree.css' %}">
    <link rel="icon" href="{% static 'Image/placement_predictor_decision_tree_favicon.png' %}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>Placement DT</span>
        </div>

        <ul class="menu">

            <li>
                <a href="{% url 'placement_predictor_decision_tree:Index' %}">
                    <i class="fa-solid fa-gauge"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="{% url 'placement_predictor_decision_tree:Prediction' %}">
                    <i class="fa-solid fa-chart-line"></i>
                    Prediction
                </a>
            </li>

            <li>
                <a href="{% url 'placement_predictor_decision_tree:About' %}">
                    <i class="fa-solid fa-circle-info"></i>
                    About
                </a>
            </li>

            <li>
                <a href="{% url 'mainapp:Index' %}">
                    <i class="fa-solid fa-house"></i>
                    Back
                </a>
            </li>

        </ul>

    </aside>

    <div class="main-content">

        <header class="topbar">

            <h2>
                {% block page_title %}
                Placement Predictor Decision Tree
                {% endblock %}
            </h2>

            <a href="{% url 'mainapp:Index' %}" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
                Back
            </a>

        </header>

        <main class="content">
            {% block content %}
            {% endblock %}
        </main>

    </div>

</div>

</body>
</html>
